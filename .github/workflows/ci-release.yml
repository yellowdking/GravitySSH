name: CI & Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content -Raw VERSION).Trim()
          if ([string]::IsNullOrWhiteSpace($v)) {
            Write-Error "VERSION file is empty."
            exit 1
          }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tagVer = $env:GITHUB_REF.Substring("refs/tags/v".Length)
            if ($tagVer -ne $v) {
              Write-Error "Tag '$env:GITHUB_REF' does not match VERSION '$v'."
              exit 1
            }
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend (TypeScript + Vite)
        working-directory: frontend
        run: npm run build

      - name: Go Vet & Unit Tests (Windows)
        shell: pwsh
        run: |
          go vet ./...
          go test -v -count=1 ./...

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-wails-v2.17.1-${{ steps.go.outputs.go-version }}

      - name: Install Wails v2 CLI
        shell: pwsh
        run: |
          $goBin = (go env GOPATH) + "\bin"
          echo "$goBin" >> $env:GITHUB_PATH
          if (-not (Test-Path "$goBin\wails.exe")) {
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          }

      - name: Generate Application Icons
        shell: pwsh
        run: python scripts/gen_icons.py

      - name: Build Windows Executable (GravitySSH.exe)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          wails build -clean -s -skipbindings -trimpath -ldflags "-s -w -X main.AppVersion=$v"

      - name: Package Windows Portable Artifacts
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $exeName = "GravitySSH-v$v-windows-amd64.exe"
          $zipName = "GravitySSH-v$v-windows-amd64-portable.zip"
          Copy-Item "build\bin\GravitySSH.exe" "dist-release\$exeName"
          Compress-Archive -Path "dist-release\$exeName", "README.md" -DestinationPath "dist-release\$zipName" -Force
          Get-ChildItem dist-release

      - name: Upload Windows Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GravitySSH-windows-amd64-v${{ steps.ver.outputs.version }}
          path: dist-release/*

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read Version
        id: ver
        shell: bash
        run: |
          VER="$(tr -d '[:space:]' < VERSION)"
          if [ -z "$VER" ]; then
            echo "::error::VERSION file is empty."
            exit 1
          fi
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VER" ]]; then
            echo "::error::Tag ${GITHUB_REF} does not match VERSION ${VER}."
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend (TypeScript + Vite)
        working-directory: frontend
        run: npm run build

      - name: Go Vet (macOS)
        run: go vet ./...

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-wails-v2.17.1-${{ steps.go.outputs.go-version }}

      - name: Install Wails v2 CLI
        shell: bash
        run: |
          GOBIN_DIR="$(go env GOPATH)/bin"
          echo "$GOBIN_DIR" >> "$GITHUB_PATH"
          if [ ! -x "$GOBIN_DIR/wails" ]; then
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          fi

      - name: Generate Retina Application Icon
        run: python3 scripts/gen_icons.py

      - name: Build Universal macOS App & DMG
        shell: bash
        env:
          VER: ${{ steps.ver.outputs.version }}
        run: |
          wails build -platform darwin/universal -clean -s -skipbindings -trimpath -ldflags "-s -w -X main.AppVersion=$VER"
          lipo -archs build/bin/GravitySSH.app/Contents/MacOS/GravitySSH
          xattr -cr build/bin/GravitySSH.app
          codesign --force --deep --sign - build/bin/GravitySSH.app
          codesign --verify --deep --strict build/bin/GravitySSH.app

          rm -rf dmg-root dist-macos
          mkdir -p dmg-root dist-macos
          cp -R build/bin/GravitySSH.app dmg-root/
          ln -s /Applications dmg-root/Applications
          if ! hdiutil create -volname "GravitySSH" -srcfolder dmg-root -ov -format UDZO "dist-macos/GravitySSH-v${VER}-darwin-universal.dmg"; then
            sleep 2
            hdiutil create -volname "GravitySSH" -srcfolder dmg-root -ov -format UDZO "dist-macos/GravitySSH-v${VER}-darwin-universal.dmg"
          fi
          ls -lh dist-macos

      - name: Upload macOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GravitySSH-darwin-universal-v${{ steps.ver.outputs.version }}
          path: dist-macos/*

  test-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Race Detector Tests (internal)
        run: go test -race -count=1 ./internal/...

  release:
    needs: [test-and-build, build-macos, test-race]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: release-pipeline
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check Existing Release Tag
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.test-and-build.outputs.version }}
          TAG: ${{ needs.test-and-build.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VER" ]]; then
            echo "::error::Tag ${GITHUB_REF} does not match VERSION ${VER}."
            exit 1
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; skipping automatic release on main."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download Windows Build Artifacts
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: GravitySSH-windows-amd64-v${{ needs.test-and-build.outputs.version }}
          path: dist-release

      - name: Download macOS Build Artifacts
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: GravitySSH-darwin-universal-v${{ needs.test-and-build.outputs.version }}
          path: dist-release

      - name: Generate Unified SHA256 Checksums
        if: steps.check.outputs.publish == 'true'
        shell: bash
        working-directory: dist-release
        env:
          VER: ${{ needs.test-and-build.outputs.version }}
        run: |
          rm -f SHA256SUMS.txt
          sha256sum \
            "GravitySSH-v${VER}-windows-amd64.exe" \
            "GravitySSH-v${VER}-windows-amd64-portable.zip" \
            "GravitySSH-v${VER}-darwin-universal.dmg" \
            > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test-and-build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GravitySSH ${{ needs.test-and-build.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## GravitySSH ${{ needs.test-and-build.outputs.tag }}

            - **Windows (x64)**：`GravitySSH-${{ needs.test-and-build.outputs.tag }}-windows-amd64.exe` · `GravitySSH-${{ needs.test-and-build.outputs.tag }}-windows-amd64-portable.zip`
            - **macOS (Apple Silicon & Intel Universal)**：`GravitySSH-${{ needs.test-and-build.outputs.tag }}-darwin-universal.dmg`（拖入 `Applications` 即可使用；首次启动若遇系统拦截可执行 `xattr -cr /Applications/GravitySSH.app`）
          files: |
            dist-release/GravitySSH-v${{ needs.test-and-build.outputs.version }}-windows-amd64.exe
            dist-release/GravitySSH-v${{ needs.test-and-build.outputs.version }}-windows-amd64-portable.zip
            dist-release/GravitySSH-v${{ needs.test-and-build.outputs.version }}-darwin-universal.dmg
            dist-release/SHA256SUMS.txt

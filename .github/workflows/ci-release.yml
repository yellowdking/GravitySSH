name: CI & Windows Release

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - 'README.md'
      - '*.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-and-build:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        id: go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Read Version
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content -Raw VERSION).Trim()
          if ([string]::IsNullOrWhiteSpace($v)) {
            Write-Error "VERSION file is empty."
            exit 1
          }
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tagVer = $env:GITHUB_REF.Substring("refs/tags/v".Length)
            if ($tagVer -ne $v) {
              Write-Error "Tag '$env:GITHUB_REF' does not match VERSION '$v'."
              exit 1
            }
          }
          echo "version=$v" >> $env:GITHUB_OUTPUT
          echo "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run Frontend Unit Tests
        working-directory: frontend
        run: npm test

      - name: Build Frontend (TypeScript + Vite)
        working-directory: frontend
        run: npm run build

      - name: Go Vet & Unit Tests (Windows DPAPI, Vault, SSH Proxy/Jump, Autocomplete)
        shell: pwsh
        run: |
          go vet ./...
          go test -v -count=1 ./...

      - name: Cache Wails CLI
        uses: actions/cache@v4
        with:
          path: ~/go/bin
          key: ${{ runner.os }}-wails-v2.17.1-${{ steps.go.outputs.go-version }}

      - name: Install Wails v2 CLI
        shell: pwsh
        run: |
          $goBin = (go env GOPATH) + "\bin"
          echo "$goBin" >> $env:GITHUB_PATH
          if (-not (Test-Path "$goBin\wails.exe")) {
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
          }

      - name: Generate Windows Application Icons
        shell: pwsh
        run: python scripts/gen_icons.py

      - name: Build Windows Executable (GravitySSH.exe)
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          wails build -clean -s -skipbindings -trimpath -ldflags "-s -w -X main.AppVersion=$v"

      - name: Package Portable Artifacts & SHA256 Checksums
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          New-Item -ItemType Directory -Force -Path dist-release | Out-Null
          $exeName = "GravitySSH-v$v-windows-amd64.exe"
          $zipName = "GravitySSH-v$v-windows-amd64-portable.zip"
          Copy-Item "build\bin\GravitySSH.exe" "dist-release\$exeName"
          Compress-Archive -Path "dist-release\$exeName", "README.md" -DestinationPath "dist-release\$zipName" -Force

          $hashes = @()
          foreach ($f in @($exeName, $zipName)) {
            $h = (Get-FileHash "dist-release\$f" -Algorithm SHA256).Hash.ToLower()
            $hashes += "$h  $f"
          }
          $hashes -join "`n" | Set-Content -Encoding utf8 "dist-release\SHA256SUMS.txt"
          Get-ChildItem dist-release

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GravitySSH-windows-amd64-v${{ steps.ver.outputs.version }}
          path: dist-release/*

  test-race:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Go Race Detector Tests (internal)
        run: go test -race -count=1 ./internal/...

  release:
    needs: [test-and-build, test-race]
    if: >-
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    concurrency:
      group: release-pipeline
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - name: Check Existing Release Tag
        id: check
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VER: ${{ needs.test-and-build.outputs.version }}
          TAG: ${{ needs.test-and-build.outputs.tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF#refs/tags/v}" != "$VER" ]]; then
            echo "::error::Tag ${GITHUB_REF} does not match VERSION ${VER}."
            exit 1
          fi
          if [ "$GITHUB_REF" = "refs/heads/main" ]; then
            if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" >/dev/null 2>&1; then
              echo "Release ${TAG} already exists; skipping automatic release on main."
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"

      - name: Download Build Artifacts
        if: steps.check.outputs.publish == 'true'
        uses: actions/download-artifact@v4
        with:
          name: GravitySSH-windows-amd64-v${{ needs.test-and-build.outputs.version }}
          path: dist-release

      - name: Create GitHub Release
        if: steps.check.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.test-and-build.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: GravitySSH ${{ needs.test-and-build.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## GravitySSH ${{ needs.test-and-build.outputs.tag }} (Windows x64)

            Antigravity 风格的 Windows 现代化 SSH 客户端：
            - **左侧服务器管理 + 独立 SSH 密钥库**（支持文件加载、粘贴导入、生成 Ed25519/RSA-4096 及一键公钥部署）
            - **SOCKS5 / HTTP 代理 + 多级跳板机（Bastion）** 支持弱网与内网机器连接，内置 TOFU 主机指纹校验
            - **连接自动就绪 SFTP 文件管理**（支持文件浏览、上传、拖入上传、下载、在线文本编辑、远程打包/解压与 `chmod` 权限修改）
            - **终端体验与运维安全**：实时主机监控栏（CPU/内存/磁盘）、6 组常用运维预设、粘贴安全卫士（危险命令与不可见控制字符拦截）、终端关键字高亮、自动英文输入法切换与智能命令补齐
            - **零知识多端同步（`synctool-v1`）**：支持已配对设备 0-RTT 一键离线信箱推送与扫码/核验码一次性直传（X25519 + Ed25519 + AES-256-GCM 流式加密，TLS 1.3 + SPKI 指纹固定，支持自建 `ghcr.io/yellowdking/synctool:latest` 中继）
            - **Windows DPAPI (MachineGuid + User + App Entropy) + AES-256-GCM + 可选主密码双重锁定** 防拷贝本地加密保险库，内置版本更新检查

            ### 下载说明
            - 直接下载 **`GravitySSH-${{ needs.test-and-build.outputs.tag }}-windows-amd64.exe`** 双击即可运行（单文件绿色版，无需安装；依赖系统 Microsoft Edge WebView2 运行时，Windows 11 默认自带；无论版本号为何，AppData 运行目录统一为 `%APPDATA%\GravitySSH`，配置文件统一保存在程序同目录 `gsshconfig\vault.gsv`）。
          files: |
            dist-release/GravitySSH-v${{ needs.test-and-build.outputs.version }}-windows-amd64.exe
            dist-release/GravitySSH-v${{ needs.test-and-build.outputs.version }}-windows-amd64-portable.zip
            dist-release/SHA256SUMS.txt

name: Build & Publish sshsync Docker Image

on:
  push:
    branches: [main]
    paths:
      - 'cmd/sshsync/**'
      - '.github/workflows/sshsync-docker.yml'
  pull_request:
    branches: [main]
    paths:
      - 'cmd/sshsync/**'
      - '.github/workflows/sshsync-docker.yml'
  workflow_dispatch:

concurrency:
  group: sshsync-docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-sshsync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Run sshsync Go Vet & Unit Tests
        run: |
          go vet ./cmd/sshsync/...
          go test -v -count=1 ./cmd/sshsync/...

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check Docker Hub Publish Credentials
        id: docker_creds
        shell: bash
        env:
          DH_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          DH_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ] && [ -n "$DH_USER" ] && [ -n "$DH_TOKEN" ]; then
            echo "can_push=true" >> "$GITHUB_OUTPUT"
            echo "repo=${DH_USER}/sshsync" >> "$GITHUB_OUTPUT"
          else
            echo "can_push=false" >> "$GITHUB_OUTPUT"
            echo "repo=bbplin/sshsync" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub
        if: steps.docker_creds.outputs.can_push == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build (and Push if configured) Multi-Arch Image
        uses: docker/build-push-action@v6
        with:
          context: ./cmd/sshsync
          file: ./cmd/sshsync/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ steps.docker_creds.outputs.can_push == 'true' }}
          tags: |
            ${{ steps.docker_creds.outputs.repo }}:latest
            ${{ steps.docker_creds.outputs.repo }}:sha-${{ github.sha }}

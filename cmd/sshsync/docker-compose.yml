services:
  sshsync:
    image: bbplin/sshsync:latest
    container_name: sshsync
    restart: unless-stopped
    ports:
      - "54843:54843"
    read_only: true
    mem_limit: 96m
    pids_limit: 64
    cpus: '0.5'
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    volumes:
      - ./certs:/data
